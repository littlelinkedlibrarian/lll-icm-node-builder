<div id="lll-app" aria-live="polite">
  <header><span class="mark">L</span><div><strong>Little Green Library</strong><small id="mode">Your local catalog</small></div></header>
  <div id="summary"></div><div id="map"></div><div id="items"></div>
</div>
<style>
  :root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}#lll-app{padding:14px;color:#173f35;background:#fffdf8;border-radius:16px}header{display:flex;align-items:center;gap:9px;margin-bottom:12px}.mark{display:grid;place-items:center;width:34px;height:38px;border-radius:14px 14px 6px 6px;background:#173f35;color:#fffdf8;font:700 19px Georgia}header div{display:flex;flex-direction:column}header strong{font:600 16px Georgia}header small{font-size:11px;color:#547064}#summary{font:22px/1.1 Georgia;margin:8px 0 14px}.card{padding:10px 12px;border:1px solid #d9ddcf;border-radius:12px;margin-top:7px;background:white}.card strong{display:block;font:600 16px Georgia}.card small{color:#547064}.map{height:210px;position:relative;overflow:hidden;border-radius:14px;background-color:#dce4ce;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:30px 30px}.pin{position:absolute;transform:translate(-50%,-100%);width:27px;height:27px;border-radius:50% 50% 50% 4px;rotate:-45deg;background:#c76e4e;color:white;display:grid;place-items:center}.pin span{rotate:45deg;font-size:12px}.empty{padding:22px;text-align:center;border:1px dashed #aeb9a8;border-radius:12px;color:#547064}@media(prefers-color-scheme:dark){#lll-app{background:#173f35;color:#f8f2e7}.mark{background:#f8f2e7;color:#173f35}.card{background:#244e43;border-color:#4f6f66}.card small,header small{color:#c7d7cf}.map{filter:brightness(.8)}}
</style>
<script type="module">
  const root=document.getElementById("lll-app"),summary=document.getElementById("summary"),items=document.getElementById("items"),map=document.getElementById("map"),mode=document.getElementById("mode");
  const esc=value=>String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
  function render(data={}){items.replaceChildren();map.replaceChildren();map.className="";mode.textContent=data.mode?data.mode.replaceAll("_"," "):"Your local catalog";
    if(data.boxes){summary.textContent=`${data.boxes.length} library box${data.boxes.length===1?"":"es"}`;if(data.renderMap){map.className="map";data.boxes.filter(b=>b.latitude!==null&&b.longitude!==null).forEach(box=>{const pin=document.createElement("div");pin.className="pin";pin.title=box.name;pin.style.left=`${((Number(box.longitude)+180)/360)*94+3}%`;pin.style.top=`${((90-Number(box.latitude))/180)*88+6}%`;pin.innerHTML="<span>⌂</span>";map.append(pin)})}data.boxes.forEach(box=>items.insertAdjacentHTML("beforeend",`<div class="card"><strong>${esc(box.name)}</strong><small>${esc(box.location||"Location not published")} · ${box.bookCount??0} books</small></div>`));}
    else if(data.books){summary.textContent=`${data.books.length} catalog result${data.books.length===1?"":"s"}`;data.books.forEach(book=>items.insertAdjacentHTML("beforeend",`<div class="card"><strong>${esc(book.title)}</strong><small>${esc(book.author)}${book.boxName?` · ${esc(book.boxName)}`:""}</small></div>`));}
    else if(data.book){summary.textContent=data.book.title;items.innerHTML=`<div class="card"><strong>${esc(data.book.author)}</strong><small>${esc(data.book.description||"No description yet.")}</small></div>`;}
    else if(data.candidate){summary.textContent="Candidate ready for review";items.innerHTML=`<div class="card"><strong>${esc(data.candidate.fields.title)}</strong><small>${esc(data.candidate.fields.author)} · not added yet</small></div>`;}
    else{summary.textContent="Little Green Library";items.innerHTML='<div class="empty">Ask to see boxes or search for a book.</div>'}}
  render(window.openai?.toolOutput);window.addEventListener("openai:set_globals",event=>render(event.detail?.globals?.toolOutput??window.openai?.toolOutput));window.addEventListener("message",event=>{if(event.source!==window.parent||event.data?.method!=="ui/notifications/tool-result")return;render(event.data.params?.structuredContent)});
</script>
